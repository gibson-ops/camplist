<!doctype html>
<!--
  The web document, overriding the one @expo/cli ships.

  WHY THIS FILE AND NOT `app/+html.tsx`. That is the file Expo's docs point at, and it does nothing
  here: it only runs under static rendering, and this app is `web.output: 'single'` (an SPA). For an
  SPA the dev server and `expo export` both read `public/index.html` if it exists and fall back to
  the template inside @expo/cli otherwise — see `getTemplateIndexHtmlAsync` in
  @expo/cli/build/src/start/server/webTemplate.js. A `+html.tsx` here was silently ignored.

  IT IS THE VENDORED TEMPLATE PLUS A HEAD. Everything from `<meta charset>` down to `#root` is
  @expo/cli's template verbatim, including the `#root` div its script tags are appended after. Diff
  against node_modules/@expo/cli/static/template/index.html when upgrading Expo — this file no
  longer tracks it automatically.

  THE TEMPLATE'S `%LANG_ISO_CODE%` AND `%WEB_TITLE%` PLACEHOLDERS ARE SPELLED OUT INSTEAD. The dev
  server appends the bundle script but does NOT substitute them, so a placeholder here renders
  literally in the tab — measured, not assumed. Spelled out, dev and `expo export` agree, and the
  title is "Camp List" rather than app.config's "Camp List (Dev)" because on web there is only one
  build and this string is what a browser tab and a bookmark show.

  THE VIEWPORT LINE IS UNCHANGED, DELIBERATELY. `lib/webChrome.ts` appends
  `interactive-widget=resizes-content` at runtime and guards against doing it twice, so hardcoding
  it here would work and would apply a frame earlier. Resisted: the sheet's keyboard behavior took
  a dozen attempts to settle, iOS reports mutually inconsistent viewport numbers (see
  `Sheet.web.tsx`), and a first-paint viewport change is the kind of variable that reopened it last
  time. Move it here only alongside a device test.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Camp List</title>

    <!--
      WHAT MAKES IT INSTALLABLE. Without these, "Add to Home Screen" saved a screenshot of the page
      under a generic icon and reopened in a Safari tab.

      Android and desktop take everything from the manifest. iOS reads it too since 16.4 but only
      partly, which is why the `apple-` tags repeat things the manifest already says.
    -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      TWO theme colors, because the app follows the system and a single value is wrong half the time.
      Safari honors `media` here. basalt and paper are the app's own backgrounds — see design/tokens.
      The manifest can only carry ONE `background_color`, so it holds the dark one and these are what
      make light mode agree.
    -->
    <meta name="theme-color" content="#0a0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)" />

    <!--
      iOS takes the home screen icon from HERE, not from the manifest, and applies its own rounding
      — so the file is square and full-bleed, the same reasoning as the native icons.

      `apple-mobile-web-app-title` is the label written under the icon. It is set even though
      `<title>` now says the same thing, because the fallback is the title and a home screen label
      should not be able to drift with whatever a tab happens to need.

      `status-bar-style` HAS ONLY THREE VALUES AND `default` MEANS LIGHT. It paints the status bar
      white with black text, which on a near-black app is the white strip across the top of the
      screen — installed, it is the first thing you see. `black` is the fix and it is the whole fix:
      opaque, page still below it, no layout change.

      `black-translucent` is the tempting third option — it would run the page under the clock so
      basalt reached the very top — but it needs `viewport-fit=cover` plus safe-area insets to keep
      content out from under the notch, and that is a viewport change on a document whose viewport
      the sheet is sensitive to. Not worth it for a millimetre of black.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Camp List" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!--
      THE WHITE FLASH ON LAUNCH, which is not the app and not the manifest.

      Nothing here gave the document a background, so the browser painted its own — white — from the
      first frame until React mounted and drew a screen. On a dark app opened at dusk that is the
      most visible thing about it.

      `color-scheme` is the half that does the real work: it tells the browser this document handles
      both schemes, so the canvas it paints BEFORE any CSS of ours applies is already dark in dark
      mode, along with scrollbars and form controls. The explicit colors then pin it to the app's own
      basalt and paper rather than the browser's idea of dark.

      Separate block from `expo-reset` below so that one stays byte-identical to the template it was
      copied from.
    -->
    <style id="camplist-launch-paint">
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        background-color: #0a0b0c;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #f3f5f7;
        }
      }
    </style>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
