# Each user receives every row of the households they belong to.
# Syntax: https://docs.powersync.com/sync/streams/ctes.md
config:
  edition: 3

streams:
  household:
    auto_subscribe: true
    with:
      my_households: SELECT household_id FROM household_members WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM households WHERE id IN my_households
      - SELECT * FROM household_members WHERE household_id IN my_households
      - SELECT * FROM lists WHERE household_id IN my_households
      - SELECT * FROM items WHERE household_id IN my_households
      - SELECT * FROM presence WHERE household_id IN my_households
